app-id: io.github.fidele007.akkhara
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: akkhara
separate-locales: false
finish-args:
  - --share=network # access the network
  - --share=ipc # share IPC namespace with the host (necessary for X11)
  - --socket=wayland # show windows using wayland
  - --socket=fallback-x11 # fallback to x11 if wayland is not available
  - --socket=pulseaudio # Play sound with PulseAudio (?)
  - --device=dri # GPU acceleration if needed
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /etc
  - /man
  - /lib/pkgconfig
  - /lib/metatypes
  - /share/bash-completion
  - /share/doc
  - /share/man
  - /share/zsh

modules:
  # These are the required dependencies
  - name: libmpv
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dbuild-date=false
      - -Dlibmpv=true
      - -Dmanpage-build=disabled
      - -Dlibarchive=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Duchardet=disabled
      - -Ddrm=disabled
      - -Ddvdnav=disabled
      - -Dcplayer=false
      - -Dtests=false
      - -Djpeg=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
    modules:
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dvulkan=enabled
          - -Dd3d11=disabled
          - -Ddemos=False
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: git
            url: https://github.com/haasn/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$
        modules:
          - name: glslang
            buildsystem: cmake-ninja
            config-opts:
              - -DBUILD_SHARED_LIBS=ON
            cleanup:
              - /bin
              - /include
              - /lib/cmake
            sources:
              - type: archive
                url: https://github.com/KhronosGroup/glslang/archive/refs/tags/16.3.0.tar.gz
                sha256: efff5a15258dce1ca2d323bf64c974f5fca03778174615dbc30c8d36db645bf5
      - name: libass
        cleanup:
          - /include
          - /lib/*.la
          - /lib/pkgconfig
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
            sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a
      - name: ffmpeg
        cleanup:
          - /include
          - /lib/pkgconfig
          - /share/ffmpeg/examples
        config-opts:
          - --enable-shared
          - --disable-static
          - --enable-gnutls
          - --disable-doc
          - --disable-programs
          - --disable-encoders
          - --disable-muxers
          - --enable-encoder=png
          - --enable-libv4l2
          - --enable-libdav1d
        sources:
          - type: git
            url: https://git.ffmpeg.org/ffmpeg.git
            tag: n8.1.1
            commit: 239f2c733de417201d7ad3b3b8b0d9b63285b2b1
  # -----------------------------------------------------------------------------------
  - name: akkhara
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      # Copy all built files to Flatpak-based location
      - mkdir -p /app/akkhara
      - cp -r * /app/akkhara/
      - chmod +x /app/akkhara/akkhara
      - mkdir -p /app/bin
      - ln -s /app/akkhara/akkhara /app/bin/akkhara
      # Install the icon
      - install -Dm644 io.github.fidele007.akkhara.svg -t /app/share/icons/hicolor/scalable/apps/
      # Install the desktop file
      - install -Dm644 io.github.fidele007.akkhara.desktop -t /app/share/applications/
      # Install the AppStream metadata file.
      - install -Dm644 io.github.fidele007.akkhara.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://github.com/fidele007/akkhara-support/releases/download/1.5.0/akkhara-desktop_1.5.0_linux_amd64.tar.gz
        sha256: 30aec266afc981d9d3bf20ff9e94424ef575d35edfc87fcd75322b75ffb31447
        strip-components: 0
