app-id: io.github.fidele007.akkhara
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: akkhara
separate-locales: false
finish-args:
  - --share=network # access the network
  - --share=ipc # share IPC namespace with the host (necessary for X11)
  - --socket=wayland # show windows using wayland
  - --socket=fallback-x11 # fallback to x11 if wayland is not available
  - --socket=pulseaudio # Play sound with PulseAudio (?)
  - --device=dri # GPU acceleration if needed
  - --own-name=com.fidele007.akkhara # To fix `Failed to register: GDBus.Error:org.freedesktop.DBus.Error.ServiceUnknown` error
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # These are the required dependencies
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Dbuild-date=false
      - -Dlibmpv=true
      - -Dmanpage-build=disabled
      - -Dlibarchive=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Duchardet=disabled
      - -Ddrm=disabled
      - -Ddvdnav=disabled
      - -Dcplayer=false
      - -Dtests=false
      - -Djpeg=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
    modules:
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dvulkan=enabled
          - -Dd3d11=disabled
          - -Ddemos=False
        sources:
          - type: git
            url: https://github.com/haasn/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$
        modules:
          - name: glslang
            buildsystem: cmake-ninja
            config-opts:
              - -DBUILD_SHARED_LIBS=ON
              - -DENABLE_OPT=OFF
            cleanup:
              - /bin
              - /lib/cmake
            sources:
              - type: archive
                url: https://github.com/KhronosGroup/glslang/archive/refs/tags/16.2.0.tar.gz
                sha256: 01985335785c97906a91afe3cb5ee015997696181ec6c125bab5555602ba08e2

      - name: libass
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
            sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  # -----------------------------------------------------------------------------------

  - name: akkhara
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      # Copy all built files to Flatpak-based location
      - mkdir -p /app/akkhara
      - cp -r * /app/akkhara/
      - chmod +x /app/akkhara/akkhara
      - mkdir -p /app/bin
      - ln -s /app/akkhara/akkhara /app/bin/akkhara
      # Install the icon
      - install -Dm644 io.github.fidele007.akkhara.svg -t /app/share/icons/hicolor/scalable/apps/
      # Install the desktop file
      - install -Dm644 io.github.fidele007.akkhara.desktop -t /app/share/applications/
      # Install the AppStream metadata file.
      - install -Dm644 io.github.fidele007.akkhara.metainfo.xml -t /app/share/metainfo/
      - rm /app/akkhara/{*.desktop,*.xml,*.svg}
    sources:
      - type: archive
        url: https://github.com/fidele007/akkhara-support/releases/download/1.4.2/akkhara-desktop_1.4.2_linux_amd64.tar.gz
        sha256: 91aa0720feee90807e466594c595d4138ba374f27382cb186c9ec952d6a149aa
        strip-components: 0
      - type: patch
        path: fix-screenshots.patch
